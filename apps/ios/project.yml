name: Rocky
options:
  bundleIdPrefix: family.rocky
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  # Google retired official iOS WebRTC binary distribution after Chromium M80 (2020); this is
  # the standard community replacement -- prebuilt XCFrameworks per Chromium milestone, actively
  # maintained. Needed because Apple ships no native WebRTC/RTCPeerConnection equivalent, and
  # OpenAI's own docs categorize WebRTC (not WebSocket) as the transport for "browser and mobile
  # clients that capture or play audio directly" -- WebSocket is for servers that already have
  # audio arriving from elsewhere, not a phone capturing its own mic.
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    from: 151.0.0
targets:
  Rocky:
    type: application
    platform: iOS
    sources:
      - path: Rocky/Sources
      - path: Rocky/Resources
    dependencies:
      - package: WebRTC
    info:
      path: Generated/Rocky-Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Rocky listens so you can talk with her and she can drive the robot."
        NSLocalNetworkUsageDescription: "Rocky connects to the mBot2 robot and the laptop's voice service over your local Wi-Fi network."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Baked in at build time from the repo root .env's OPENAI_API_KEY by scripts/generate.sh
        # (always use that, never `xcodegen generate` directly) -- never typed on the phone, never
        # committed. Empty string, not an error, when .env has no key yet.
        RockyOpenAIKey: "${ROCKY_OPENAI_KEY_IOS}"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.rocky.ios
        PRODUCT_NAME: Rocky
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z8KZ48J5SW
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RockyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Rocky/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.rocky.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rocky
schemes:
  Rocky:
    build:
      targets:
        Rocky: all
        RockyTests: [test]
    test:
      config: Debug
      targets:
        - RockyTests
    run:
      config: Debug
