name: Rocky
options:
  bundleIdPrefix: family.rocky
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Rocky:
    type: application
    platform: iOS
    sources:
      - path: Rocky/Sources
    resources:
      - path: Rocky/Resources
    info:
      path: Generated/Rocky-Info.plist
      properties:
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: "Rocky listens for spoken commands to drive the robot."
        NSSpeechRecognitionUsageDescription: "Rocky recognizes spoken commands to drive the robot."
        NSLocalNetworkUsageDescription: "Rocky connects to the mBot2 robot over your local Wi-Fi network."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.rocky.ios
        PRODUCT_NAME: Rocky
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: Z8KZ48J5SW
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RockyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Rocky/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.rocky.ios.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Rocky
schemes:
  Rocky:
    build:
      targets:
        Rocky: all
        RockyTests: [test]
    test:
      config: Debug
      targets:
        - RockyTests
    run:
      config: Debug
