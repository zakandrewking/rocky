; Stage 2 toolchain bring-up. ESP-IDF over Arduino-ESP32, per PLAN.md's framework
; discussion: the whole reason to leave CyberOS is precise I2S DMA and dual-core
; task control, which is the layer Arduino's own abstraction sits on top of.
;
; board = esp32dev matches the chip esptool detected on the real board
; (ESP32-D0WD) and is also what Makeblock's own CyberPi-Library-for-Arduino uses
; in its platformio.ini, confirmed against that repo rather than guessed.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; esp32dev's board manifest defaults to 4MB; this specific board reported 8MB
; via `esptool flash-id` during the recovery backup (docs/recovery.md). Not
; overriding this produced a real "Expected 4MB, found 2MB!" warning at
; upload time - stating the flash size explicitly avoids relying on runtime
; auto-detection at all.
board_upload.flash_size = 8MB
